name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests

      - name: Validate API syntax
        run: |
          python -m py_compile api.py

      - name: Build Docker image
        run: |
          docker build -t aircraft-predictive-maintenance:ci .

      - name: Start Docker container
        run: |
          docker run -d \
            --name aircraft-pm-api \
            -p 8000:8000 \
            aircraft-predictive-maintenance:ci

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:8000/health; then
              echo
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done

          echo "API failed to start"
          docker logs aircraft-pm-api
          exit 1

      - name: Verify health endpoint
        run: |
          curl -fs http://127.0.0.1:8000/health

      - name: Stop Docker container
        if: always()
        run: |
          docker stop aircraft-pm-api || true